<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dithering Wave</title>
<style>
  :root{
    --bg: #0a0a0c;
    --panel: rgba(17,19,24,0.82);
    --hairline: #2a2d35;
    --text: #e8e6e0;
    --text-dim: #8b8f99;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:var(--bg); overflow:hidden; }
  body{ font-family:var(--mono); color:var(--text); }

  canvas#gl{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  .title{
    position:fixed; top:28px; left:32px; z-index:5;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-dim);
    pointer-events:none;
  }
  .title b{ color:var(--text); font-weight:600; }

  .credit{
    position:fixed; top:28px; right:32px; z-index:6;
    font-size:11px; letter-spacing:0.1em; color:var(--text-dim);
    text-decoration:none; opacity:0.5;
    padding:4px 8px; margin:-4px -8px;
    border-radius:4px;
    transition: color 0.15s ease, opacity 0.15s ease, background-color 0.15s ease;
  }
  .credit:hover{ color:var(--text); opacity:0.9; background:rgba(255,255,255,0.05); }
  .credit:active{ opacity:0.6; transform: translateY(1px); }
  .credit:focus-visible{ outline:1px solid var(--hairline); outline-offset:2px; }

  .dock{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    z-index:10;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:14px;
    padding:14px 18px;
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    display:flex; align-items:center; flex-wrap:wrap; justify-content:center; gap:14px 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 48px);
    overflow-x: hidden;
    overflow-y: auto;
    transition: padding 0.2s ease, gap 0.2s ease;
  }
  .dock.collapsed{ padding:8px; gap:8px; }

  .dockControls{ display:contents; }
  .dock.collapsed .dockControls{ display:none; }

  .dockToggle{
    display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; flex:none; padding:0;
    background:transparent; border:1.5px solid var(--hairline); border-radius:50%;
    color:var(--text-dim); cursor:pointer;
    transition: color 0.15s ease, background-color 0.15s ease;
  }
  .dockToggle:hover{ color:var(--text); background:rgba(255,255,255,0.05); }
  .dockToggle svg{ display:block; }

  .group{ display:flex; flex-direction:column; gap:7px; min-width:0; }
  .group-label{ font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); }

  .swatches{ display:flex; gap:6px; flex-wrap:wrap; max-width:100%; }
  .swatch{
    width:26px; height:26px; border-radius:6px; padding:0; cursor:pointer;
    border:1.5px solid transparent; background:transparent;
    image-rendering: pixelated;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .swatch canvas{ width:100%; height:100%; border-radius:4.5px; display:block; image-rendering:pixelated; }
  .swatch:hover{ transform: translateY(-2px); }
  .swatch.active{ border-color: var(--text); }

  .sliderrow{ display:flex; align-items:center; gap:8px; }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:84px; height:2px; background:var(--hairline); border-radius:2px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
    background:var(--text); cursor:pointer; border:2px solid var(--bg);
  }
  .val{ font-size:10px; color:var(--text-dim); min-width:28px; text-align:right; }

  input[type=color]{
    width:26px; height:26px; border:1.5px solid var(--hairline); border-radius:6px;
    background:none; padding:0; cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:2px; }
  input[type=color]::-webkit-color-swatch{ border:none; border-radius:4px; }

  .select-wrap{ position:relative; display:flex; align-items:center; }
  .select-wrap::after{
    content:"⌄"; position:absolute; right:8px; top:50%; transform:translateY(-52%);
    color:var(--text-dim); font-size:11px; pointer-events:none;
  }
  .dock-select{
    -webkit-appearance:none; appearance:none;
    background:rgba(255,255,255,0.03);
    border:1.5px solid var(--hairline);
    border-radius:6px;
    color:var(--text);
    font-family:var(--mono); font-size:11px;
    padding:6px 24px 6px 10px;
    height:26px;
    cursor:pointer;
    outline:none;
  }
  .dock-select option{ background:#14161b; color:var(--text); }

  .formatNote{
    font-size:9.5px; line-height:1.4; color:var(--text-dim);
    max-width:220px; margin-top:2px;
  }

  .divider{ width:1px; align-self:stretch; background:var(--hairline); }

  .dlbtn{
    display:flex; align-items:center; gap:8px;
    background:var(--text); color:#111;
    border:none; border-radius:9px; padding:0 16px; height:38px;
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.04em;
    cursor:pointer; white-space:nowrap;
    transition: opacity 0.15s ease;
  }
  .dlbtn:disabled{ opacity:0.55; cursor:default; }
  .dlbtn:not(:disabled):hover{ opacity:0.88; }
  .dlicon{ display:none; }
  .dlicon svg{ display:block; }

  .dock.collapsed .dlbtn{
    width:38px; padding:0; border-radius:50%; justify-content:center;
  }
  .dock.collapsed .dlbtn .dllabel{ display:none; }
  .dock.collapsed .dlbtn .dlicon{ display:flex; align-items:center; justify-content:center; }

  .ring{
    width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(0,0,0,0.25); border-top-color:#111;
    animation: spin 0.7s linear infinite;
    display:none;
  }
  .dlbtn.busy .ring{ display:inline-block; }
  .dlbtn.busy .dllabel{ display:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .toast{
    position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--hairline); border-radius:8px;
    padding:8px 14px; font-size:11px; color:var(--text-dim); z-index:20;
    opacity:0; pointer-events:none; transition: opacity 0.25s ease;
  }
  .toast.show{ opacity:1; }

  @media (max-width: 640px){
    .dock{ gap:14px; padding:12px; }
    .divider{ display:none; }

    /* move the credit link below the tray so it doesn't crowd the breadcrumb;
       the dock (z-index:10) sits above it, so an expanded tray simply covers
       it gracefully until collapsed again */
    .credit{
      top:auto; right:auto; left:50%; bottom:6px;
      transform:translateX(-50%);
    }
    .credit:active{ transform:translateX(-50%) translateY(1px); }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div class="title"><b>Dithering</b> / <span id="titleProfile">wave</span> / 8×8</div>
<a class="credit" href="https://aizaz.framer.website/" target="_blank" rel="noopener noreferrer">Aizaz Ahmad</a>
<div class="toast" id="toast"></div>

<div class="dock" id="dock">
  <button class="dockToggle" id="dockToggle" aria-label="Toggle controls" aria-expanded="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  <div class="dockControls" id="dockControls">
  <div class="group">
    <div class="group-label">Motion</div>
    <div class="select-wrap">
      <select id="profile" class="dock-select"></select>
    </div>
  </div>

  <div class="divider"></div>

  <div class="group">
    <div class="group-label">Color</div>
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="divider"></div>

  <div class="group">
    <div class="group-label">Background</div>
    <input type="color" id="colorBack" value="#001122">
  </div>

  <div class="divider"></div>

  <div class="group">
    <div class="group-label">Pixel size</div>
    <div class="sliderrow">
      <input type="range" id="pxSize" min="1" max="10" step="1" value="3">
      <span class="val" id="pxSizeVal">3</span>
    </div>
  </div>

  <div class="group">
    <div class="group-label">Speed</div>
    <div class="sliderrow">
      <input type="range" id="speed" min="0.05" max="2" step="0.05" value="0.6">
      <span class="val" id="speedVal">0.6</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="group">
    <div class="group-label">Export size</div>
    <div class="select-wrap">
      <select id="resolution" class="dock-select"></select>
    </div>
  </div>

  <div class="group">
    <div class="group-label">Format</div>
    <div class="select-wrap">
      <select id="format" class="dock-select"></select>
    </div>
    <div class="formatNote" id="formatNote" hidden></div>
  </div>

  <div class="divider"></div>
  </div>

  <button class="dlbtn" id="downloadBtn" aria-label="Download">
    <span class="ring"></span>
    <span class="dlicon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3V14M12 14L8 10M12 14L16 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16V18C4 19.6569 5.34315 21 7 21H17C18.6569 21 20 19.6569 20 18V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="dllabel" id="downloadLabel">Download loop</span>
  </button>
</div>

<script>
(function(){
  "use strict";

  // ---------- palette: bright hues, fixed saturation/lightness ----------
  var SAT = 82, LIGHT = 56;
  var HUES = [
    { name:"Red",     h: 350 },
    { name:"Orange",  h: 24  },
    { name:"Amber",   h: 42  },
    { name:"Lime",    h: 84  },
    { name:"Green",   h: 140 },
    { name:"Teal",    h: 172 },
    { name:"Cyan",    h: 190 },
    { name:"Blue",    h: 214 },
    { name:"Indigo",  h: 248 },
    { name:"Violet",  h: 272 },
    { name:"Magenta", h: 300 },
    { name:"Pink",    h: 330 }
  ];

  function hslToRgb(h, s, l){
    h = ((h % 360) + 360) % 360; s/=100; l/=100;
    var c = (1 - Math.abs(2*l - 1)) * s;
    var x = c * (1 - Math.abs((h/60) % 2 - 1));
    var m = l - c/2;
    var r,g,b;
    if(h<60){ r=c;g=x;b=0; } else if(h<120){ r=x;g=c;b=0; }
    else if(h<180){ r=0;g=c;b=x; } else if(h<240){ r=0;g=x;b=c; }
    else if(h<300){ r=x;g=0;b=c; } else { r=c;g=0;b=x; }
    return [(r+m), (g+m), (b+m)]; // 0..1
  }
  function rgbToHex(rgb){
    return "#" + rgb.map(function(v){
      var n = Math.round(Math.max(0,Math.min(1,v))*255);
      return n.toString(16).padStart(2,"0");
    }).join("");
  }
  function hexToRgb(hex){
    hex = hex.replace("#","");
    return [
      parseInt(hex.substring(0,2),16)/255,
      parseInt(hex.substring(2,4),16)/255,
      parseInt(hex.substring(4,6),16)/255
    ];
  }

  // ---------- bayer 8x8 ordered-dither matrix ----------
  var BAYER8 = [
    0,32,8,40,2,34,10,42,
    48,16,56,24,50,18,58,26,
    12,44,4,36,14,46,6,38,
    60,28,52,20,62,30,54,22,
    3,35,11,43,1,33,9,41,
    51,19,59,27,49,17,57,25,
    15,47,7,39,13,45,5,37,
    63,31,55,23,61,29,53,21
  ];

  // ---------- movement profiles ----------
  var PROFILES = [
    { value: 0, name: "Interference" },
    { value: 1, name: "Ocean Wave" },
    { value: 2, name: "Horizon" },
    { value: 3, name: "Ribbon Glow" },
    { value: 4, name: "Radial Ripple" },
    { value: 5, name: "Plasma Drift" }
  ];

  // ---------- export resolutions ----------
  var RESOLUTIONS = [
    { key: "window", name: "Match window",             w: 0,    h: 0    },
    { key: "1080sq", name: "1080 × 1080",               w: 1080, h: 1080 },
    { key: "720sq",  name: "720 × 720",                 w: 720,  h: 720  },
    { key: "512sq",  name: "512 × 512",                 w: 512,  h: 512  },
    { key: "300sq",  name: "300 × 300",                 w: 300,  h: 300  },
    { key: "128sq",  name: "128 × 128",                 w: 128,  h: 128  },
    { key: "phone",  name: "Phone lock screen (1080×1920)", w: 1080, h: 1920 }
  ];
  // pixel-size slider is tuned against this reference frame width; export frames
  // scale it down proportionally so a 300x300 clip doesn't look chunky
  var PX_REFERENCE = 1024;

  // ---------- export formats ----------
  var FORMATS = [
    { key: "webm", name: "WebM (recommended)", kind: "video" },
    { key: "mp4",  name: "MP4 (phone lock screens)", kind: "video" },
    { key: "jpeg", name: "JPEG (still image)", kind: "image" },
    { key: "livephoto", name: "Live Photo (iOS, experimental)", kind: "livephoto" }
  ];

  // ---------- state ----------
  var state = {
    colorFront: hexToRgb("#ff0088"),
    colorBack: hexToRgb("#001122"),
    pxSize: 3,
    speed: 0.6,
    profile: 1,
    exportResKey: "300sq",
    exportFormat: "webm"
  };

  // ---------- WebGL setup ----------
  var canvas = document.getElementById("gl");

  var VERT = "#version 300 es\n" +
    "in vec2 a_pos;\n" +
    "void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }\n";

  var FRAG = "#version 300 es\n" +
    "precision highp float;\n" +
    "uniform vec2 u_resolution;\n" +
    "uniform float u_time;\n" +
    "uniform float u_pxSize;\n" +
    "uniform vec3 u_colorBack;\n" +
    "uniform vec3 u_colorFront;\n" +
    "uniform sampler2D u_dither;\n" +
    "uniform int u_profile;\n" +
    "out vec4 outColor;\n" +
    "void main(){\n" +
    "  vec2 frag = gl_FragCoord.xy;\n" +
    "  float px = max(u_pxSize, 1.0);\n" +
    "  vec2 blockCoord = floor(frag / px);\n" +
    "  vec2 uv = (blockCoord * px) / u_resolution;\n" +
    "  float ar = u_resolution.x / u_resolution.y;\n" +
    "  float t = u_time;\n" +
    "  vec2 dCoord = mod(blockCoord, 8.0);\n" +
    "  vec2 dUV = (dCoord + 0.5) / 8.0;\n" +
    "  float threshold = texture(u_dither, dUV).r;\n" +
    "  vec3 outc;\n" +
    "  float v;\n" +
    "    if(u_profile == 1){\n" +
    "      float phase = uv.x * 14.0 + uv.y * 5.0 - t * 2.0;\n" +
    "      float s = sin(phase);\n" +
    "      float shaped = sign(s) * pow(abs(s), 0.85);\n" +
    "      v = shaped * 0.5 + 0.5;\n" +
    "    } else if(u_profile == 2){\n" +
    "      float h = 0.50 + 0.09 * sin(uv.x * 3.0 + t) + 0.045 * sin(uv.x * 7.2 - t * 2.0);\n" +
    "      float d = h - uv.y;\n" +
    "      float turb = smoothstep(-0.05, 0.30, d);\n" +
    "      d += 0.035 * sin(uv.x * 7.0 - t * 3.0) * turb;\n" +
    "      d += 0.012 * sin(uv.x * 17.0 + uv.y * 4.0 + t * 2.0) * turb;\n" +
    "      v = smoothstep(-0.15, 0.02, d);\n" +
    "    } else if(u_profile == 3){\n" +
    "      float p1 = 0.42 + 0.10 * sin(uv.x * 3.1 + t);\n" +
    "      float p2 = 0.55 + 0.07 * sin(uv.x * 4.7 - t * 2.0);\n" +
    "      float p3 = 0.50 + 0.13 * sin(uv.x * 2.0 + t * 3.0);\n" +
    "      float d1 = uv.y - p1;\n" +
    "      float d2 = uv.y - p2;\n" +
    "      float d3 = uv.y - p3;\n" +
    "      float w1 = smoothstep(0.14, 0.03, abs(d1));\n" +
    "      float w2 = smoothstep(0.09, 0.02, abs(d2));\n" +
    "      float w3 = smoothstep(0.19, 0.05, abs(d3));\n" +
    "      float glow = exp(-(d1*d1) / 0.0022) * 0.9 * w1\n" +
    "                 + exp(-(d2*d2) / 0.0009) * 0.7 * w2\n" +
    "                 + exp(-(d3*d3) / 0.0040) * 0.5 * w3;\n" +
    "      v = clamp(glow, 0.0, 1.0);\n" +
    "    } else if(u_profile == 4){\n" +
    "      vec2 c = vec2((uv.x - 0.5) * ar, uv.y - 0.5);\n" +
    "      float r = length(c);\n" +
    "      v = sin(r * 26.0 - t * 3.0) * 0.5 + 0.5;\n" +
    "    } else if(u_profile == 5){\n" +
    "      float p = sin(uv.x * 10.0 + t)\n" +
    "              + sin(uv.y * 10.0 - t)\n" +
    "              + sin((uv.x + uv.y) * 10.0 + t)\n" +
    "              + sin(length(vec2((uv.x - 0.5) * ar, uv.y - 0.5)) * 10.0 - t * 2.0);\n" +
    "      v = p / 4.0 * 0.5 + 0.5;\n" +
    "    } else {\n" +
    "      v = sin((uv.x * 6.0 + uv.y * 3.0) + t)\n" +
    "        + 0.5 * sin((uv.x * 10.0 - uv.y * 4.0) - t * 2.0);\n" +
    "      v = clamp(v / 1.5 * 0.5 + 0.5, 0.0, 1.0);\n" +
    "    }\n" +
    "  outc = v > threshold ? u_colorFront : u_colorBack;\n" +
    "  outColor = vec4(outc, 1.0);\n" +
    "}\n";

  function buildRenderer(canvasEl){
    var rgl = canvasEl.getContext("webgl2", { preserveDrawingBuffer: true });
    if(!rgl){ throw new Error("WebGL2 is required for this effect."); }

    function compile(type, src){
      var sh = rgl.createShader(type);
      rgl.shaderSource(sh, src);
      rgl.compileShader(sh);
      if(!rgl.getShaderParameter(sh, rgl.COMPILE_STATUS)){
        throw new Error(rgl.getShaderInfoLog(sh));
      }
      return sh;
    }
    var prog = rgl.createProgram();
    rgl.attachShader(prog, compile(rgl.VERTEX_SHADER, VERT));
    rgl.attachShader(prog, compile(rgl.FRAGMENT_SHADER, FRAG));
    rgl.linkProgram(prog);
    if(!rgl.getProgramParameter(prog, rgl.LINK_STATUS)){
      throw new Error(rgl.getProgramInfoLog(prog));
    }
    rgl.useProgram(prog);

    var quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
    var vbo = rgl.createBuffer();
    rgl.bindBuffer(rgl.ARRAY_BUFFER, vbo);
    rgl.bufferData(rgl.ARRAY_BUFFER, quad, rgl.STATIC_DRAW);
    var posLoc = rgl.getAttribLocation(prog, "a_pos");
    rgl.enableVertexAttribArray(posLoc);
    rgl.vertexAttribPointer(posLoc, 2, rgl.FLOAT, false, 0, 0);

    var ditherTex = rgl.createTexture();
    rgl.bindTexture(rgl.TEXTURE_2D, ditherTex);
    var ditherData = new Uint8Array(64);
    for(var i=0;i<64;i++){ ditherData[i] = Math.round((BAYER8[i]/64) * 255); }
    rgl.texImage2D(rgl.TEXTURE_2D, 0, rgl.R8, 8, 8, 0, rgl.RED, rgl.UNSIGNED_BYTE, ditherData);
    rgl.texParameteri(rgl.TEXTURE_2D, rgl.TEXTURE_MIN_FILTER, rgl.NEAREST);
    rgl.texParameteri(rgl.TEXTURE_2D, rgl.TEXTURE_MAG_FILTER, rgl.NEAREST);
    rgl.texParameteri(rgl.TEXTURE_2D, rgl.TEXTURE_WRAP_S, rgl.CLAMP_TO_EDGE);
    rgl.texParameteri(rgl.TEXTURE_2D, rgl.TEXTURE_WRAP_T, rgl.CLAMP_TO_EDGE);

    var uRes = rgl.getUniformLocation(prog, "u_resolution");
    var uTime = rgl.getUniformLocation(prog, "u_time");
    var uPx = rgl.getUniformLocation(prog, "u_pxSize");
    var uBack = rgl.getUniformLocation(prog, "u_colorBack");
    var uFront = rgl.getUniformLocation(prog, "u_colorFront");
    var uDither = rgl.getUniformLocation(prog, "u_dither");
    var uProfile = rgl.getUniformLocation(prog, "u_profile");

    function draw(timeSeconds, w, h, pxPixels){
      if(canvasEl.width !== w || canvasEl.height !== h){
        canvasEl.width = w; canvasEl.height = h;
      }
      rgl.viewport(0, 0, w, h);
      rgl.useProgram(prog);
      rgl.uniform2f(uRes, w, h);
      rgl.uniform1f(uTime, timeSeconds);
      rgl.uniform1f(uPx, pxPixels);
      rgl.uniform3f(uBack, state.colorBack[0], state.colorBack[1], state.colorBack[2]);
      rgl.uniform3f(uFront, state.colorFront[0], state.colorFront[1], state.colorFront[2]);
      rgl.uniform1i(uProfile, state.profile);
      rgl.activeTexture(rgl.TEXTURE0);
      rgl.bindTexture(rgl.TEXTURE_2D, ditherTex);
      rgl.uniform1i(uDither, 0);
      rgl.bindBuffer(rgl.ARRAY_BUFFER, vbo);
      rgl.enableVertexAttribArray(posLoc);
      rgl.vertexAttribPointer(posLoc, 2, rgl.FLOAT, false, 0, 0);
      rgl.drawArrays(rgl.TRIANGLE_STRIP, 0, 4);
    }

    return { gl: rgl, draw: draw };
  }

  var liveRenderer;
  try{
    liveRenderer = buildRenderer(canvas);
  } catch(err){
    alert(err.message);
    return;
  }

  function liveDpr(){ return Math.min(window.devicePixelRatio || 1, 2); }

  function resize(){
    var dpr = liveDpr();
    var w = Math.floor(window.innerWidth * dpr);
    var h = Math.floor(window.innerHeight * dpr);
    if(canvas.width !== w || canvas.height !== h){

    var ctx = cvs.getContext("2d");
    var img = ctx.createImageData(8,8);
    for(var y=0;y<8;y++){
      for(var x=0;x<8;x++){
        var idx = y*8+x;
        var threshold = BAYER8[idx]/64;
        var useFront = 0.55 > threshold; // fixed mid-value dither mix for preview
        var c = useFront ? frontRgb : backRgb;
        var p = idx*4;
        img.data[p]   = Math.round(c[0]*255);
        img.data[p+1] = Math.round(c[1]*255);
        img.data[p+2] = Math.round(c[2]*255);
        img.data[p+3] = 255;

    }
    ctx.putImageData(img, 0, 0);

  // ---------- Live Photo (iOS) export: experimental ----------
  // Builds a JPEG + MOV pair sharing an Apple "Content Identifier" so iOS Photos
  // can offer to treat them as a single Live Photo. Byte layout for the JPEG's
  // Apple Maker Note was verified against a real iPhone sample (ExifTool's own
  // test image), not guessed from memory. The MOV side embeds the matching
  // identifier as standard QuickTime keyed metadata (moov/udta/meta/keys+ilst).
  // Known limitation: we do not embed the "still image time" timed-metadata
  // track real Apple Live Photos include — many third-party generators skip
  // this too and still get recognized, but full fidelity would add it later.

  function uuidForLivePhoto(){
    if(crypto.randomUUID) return crypto.randomUUID().toUpperCase();
    var bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    var hex = Array.prototype.map.call(bytes, function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    return (hex.slice(0,8)+"-"+hex.slice(8,12)+"-"+hex.slice(12,16)+"-"+hex.slice(16,20)+"-"+hex.slice(20)).toUpperCase();
  }

  // ----- JPEG: inject Apple Maker Note ContentIdentifier via a standard EXIF APP1 segment -----
  function buildAppleMakerNote(uuid){
    var strBytes = new TextEncoder().encode(uuid + "\0"); // ASCII EXIF strings are null-terminated
    var HEADER_LEN = 16; // "Apple iOS\0"(10) + version(2) + "MM"(2) + entryCount(2)
    var ENTRY_LEN = 12;
    var NEXT_IFD_LEN = 4;
    var stringOffset = HEADER_LEN + ENTRY_LEN + NEXT_IFD_LEN;
    var buf = new ArrayBuffer(stringOffset + strBytes.length);
    var view = new DataView(buf);
    var bytes = new Uint8Array(buf);
    var p = 0;
    var sig = "Apple iOS";
    for(var i=0;i<sig.length;i++) bytes[p++] = sig.charCodeAt(i);
    bytes[p++] = 0;
    view.setUint16(p, 1, false); p += 2;        // version
    bytes[p++] = 0x4D; bytes[p++] = 0x4D;       // "MM" byte order
    view.setUint16(p, 1, false); p += 2;        // IFD entry count = 1
    view.setUint16(p, 0x0011, false); p += 2;   // tag: ContentIdentifier
    view.setUint16(p, 2, false); p += 2;        // type: ASCII
    view.setUint32(p, strBytes.length, false); p += 4;
    view.setUint32(p, stringOffset, false); p += 4; // offset, relative to byte 0 of this blob
    view.setUint32(p, 0, false); p += 4;        // next IFD = none
    bytes.set(strBytes, p);
    return bytes;
  }

  // IFD0/ExifSubIFD tag set below was reverse-engineered from two real Live Photo
  // stills exported by the ToLive app (both AirDropped and confirmed working on
  // iOS) — not guessed. Both samples were byte-identical apart from the UUID, and
  // notably carry no Make/Model/Software at all.
  function buildExifApp1(makerNoteBytes, width, height){
    var TIFF_HEADER_LEN = 8;
    var IFD0_ENTRY_COUNT = 5;   // Orientation, XResolution, YResolution, ResolutionUnit, ExifIFDPointer
    var EXIFSUB_ENTRY_COUNT = 4; // ExifVersion, MakerNote, PixelXDimension, PixelYDimension
    var IFD0_LEN = 2 + IFD0_ENTRY_COUNT*12 + 4;
    var EXIFSUB_LEN = 2 + EXIFSUB_ENTRY_COUNT*12 + 4;

    var exifIfdOffset = TIFF_HEADER_LEN;
    var exifSubIfdOffset = TIFF_HEADER_LEN + IFD0_LEN;
    var dataAreaOffset = exifSubIfdOffset + EXIFSUB_LEN;
    var xResOffset = dataAreaOffset;
    var yResOffset = xResOffset + 8;
    var makerNoteOffset = yResOffset + 8;

    var tiff = new Uint8Array(makerNoteOffset + makerNoteBytes.length);
    var view = new DataView(tiff.buffer);
    var p = 0;
    tiff[p++] = 0x4D; tiff[p++] = 0x4D;         // "MM"
    view.setUint16(p, 0x002A, false); p += 2;   // TIFF magic
    view.setUint32(p, exifIfdOffset, false); p += 4;

    // IFD0
    view.setUint16(p, IFD0_ENTRY_COUNT, false); p += 2;
    view.setUint16(p, 0x0112, false); p += 2;   // Orientation
    view.setUint16(p, 3, false); p += 2;        // SHORT
    view.setUint32(p, 1, false); p += 4;
    view.setUint16(p, 1, false); p += 2; p += 2; // value=1, padded to 4 bytes
    view.setUint16(p, 0x011A, false); p += 2;   // XResolution
    view.setUint16(p, 5, false); p += 2;        // RATIONAL
    view.setUint32(p, 1, false); p += 4;
    view.setUint32(p, xResOffset, false); p += 4;
    view.setUint16(p, 0x011B, false); p += 2;   // YResolution
    view.setUint16(p, 5, false); p += 2;
    view.setUint32(p, 1, false); p += 4;
    view.setUint32(p, yResOffset, false); p += 4;
    view.setUint16(p, 0x0128, false); p += 2;   // ResolutionUnit
    view.setUint16(p, 3, false); p += 2;
    view.setUint32(p, 1, false); p += 4;
    view.setUint16(p, 2, false); p += 2; p += 2; // value=2 (inches), padded
    view.setUint16(p, 0x8769, false); p += 2;   // ExifIFDPointer
    view.setUint16(p, 4, false); p += 2;        // LONG
    view.setUint32(p, 1, false); p += 4;
    view.setUint32(p, exifSubIfdOffset, false); p += 4;
    view.setUint32(p, 0, false); p += 4;        // next IFD

    // Exif SubIFD
    view.setUint16(p, EXIFSUB_ENTRY_COUNT, false); p += 2;
    view.setUint16(p, 0x9000, false); p += 2;   // ExifVersion
    view.setUint16(p, 7, false); p += 2;        // UNDEFINED
    view.setUint32(p, 4, false); p += 4;
    tiff[p++]=0x30; tiff[p++]=0x32; tiff[p++]=0x32; tiff[p++]=0x31; // "0221", inline (4 bytes)
    view.setUint16(p, 0x927C, false); p += 2;   // MakerNote
    view.setUint16(p, 7, false); p += 2;        // UNDEFINED
    view.setUint32(p, makerNoteBytes.length, false); p += 4;
    view.setUint32(p, makerNoteOffset, false); p += 4;
    view.setUint16(p, 0xA002, false); p += 2;   // PixelXDimension
    view.setUint16(p, 4, false); p += 2;        // LONG
    view.setUint32(p, 1, false); p += 4;
    view.setUint32(p, width, false); p += 4;
    view.setUint16(p, 0xA003, false); p += 2;   // PixelYDimension
    view.setUint16(p, 4, false); p += 2;
    view.setUint32(p, 1, false); p += 4;
    view.setUint32(p, height, false); p += 4;
    view.setUint32(p, 0, false); p += 4;        // next IFD

    view.setUint32(xResOffset, 72, false); view.setUint32(xResOffset+4, 1, false);
    view.setUint32(yResOffset, 72, false); view.setUint32(yResOffset+4, 1, false);
    tiff.set(makerNoteBytes, makerNoteOffset);

    var exifHeader = new Uint8Array([0x45,0x78,0x69,0x66,0x00,0x00]); // "Exif\0\0"
    var payloadLen = 2 + exifHeader.length + tiff.length;
    var app1 = new Uint8Array(2 + payloadLen);
    app1[0] = 0xFF; app1[1] = 0xE1;
    new DataView(app1.buffer).setUint16(2, payloadLen, false);
    app1.set(exifHeader, 4);
    app1.set(tiff, 4 + exifHeader.length);
    return app1;
  }

  function injectContentIdentifierIntoJpeg(jpegBytes, uuid, width, height){
    var app1 = buildExifApp1(buildAppleMakerNote(uuid), width, height);
    var out = new Uint8Array(jpegBytes.length + app1.length);
    out[0] = 0xFF; out[1] = 0xD8;                 // SOI
    out.set(app1, 2);
    out.set(jpegBytes.subarray(2), 2 + app1.length);
    return out;
  }

  // ----- MOV/MP4: generic ISO-BMFF box parsing + QuickTime metadata injection -----
  function parseBoxes(bytes, start, end){
    var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var boxes = [];
    var pos = start;
    while(pos + 8 <= end){
      var size32 = view.getUint32(pos, false);
      var type = String.fromCharCode(bytes[pos+4], bytes[pos+5], bytes[pos+6], bytes[pos+7]);
      var headerLen = 8, size = size32;
      if(size32 === 1){ size = Number(view.getBigUint64(pos+8, false)); headerLen = 16; }
      else if(size32 === 0){ size = end - pos; }
      if(size <= 0) break;
      boxes.push({ type: type, start: pos, dataStart: pos + headerLen, end: pos + size });
      pos += size;
    }
    return boxes;
  }

  var MP4_CONTAINER_TYPES = ["moov","trak","mdia","minf","stbl","udta","edts"];
  function findBoxesRecursive(bytes, start, end, targetTypes, results){
    parseBoxes(bytes, start, end).forEach(function(b){
      if(targetTypes.indexOf(b.type) !== -1) results.push(b);
      if(MP4_CONTAINER_TYPES.indexOf(b.type) !== -1){
        findBoxesRecursive(bytes, b.dataStart, b.end, targetTypes, results);
      }
    });
  }

  function makeBox(type, payload){
    var out = new Uint8Array(8 + payload.length);
    new DataView(out.buffer).setUint32(0, out.length, false);
    for(var i=0;i<4;i++) out[4+i] = type.charCodeAt(i);
    out.set(payload, 8);
    return out;
  }
  function concatBytes(arrays){
    var total = arrays.reduce(function(s,a){ return s + a.length; }, 0);
    var out = new Uint8Array(total), off = 0;
    arrays.forEach(function(a){ out.set(a, off); off += a.length; });
    return out;
  }

  // Byte layouts below were reverse-engineered directly from two real, working
  // Live Photo MOV files (AirDropped, confirmed working on iOS), not guessed.
  function makeHdlrBox(){
    var payload = new Uint8Array(26); // version/flags(4)+predefined(4)+handlerType(4)+reserved(12)+name(2)
    payload[8]=0x6d; payload[9]=0x64; payload[10]=0x74; payload[11]=0x61; // "mdta"
    return makeBox("hdlr", payload);
  }
  // Movie-level meta/keys entries: size(4) + namespace(4)="mdta" + name — no wrapper.
  function makeKeysBox(keyNames){
    var entries = keyNames.map(function(name){
      var nameBytes = new TextEncoder().encode(name);
      var e = new Uint8Array(8 + nameBytes.length);
      new DataView(e.buffer).setUint32(0, e.length, false);
      e[4]=0x6d; e[5]=0x64; e[6]=0x74; e[7]=0x61; // "mdta" namespace
      e.set(nameBytes, 8);
      return e;
    });
    var header = new Uint8Array(8);
    new DataView(header.buffer).setUint32(4, keyNames.length, false);
    return makeBox("keys", concatBytes([header].concat(entries)));
  }
  // Track-local (stsd/mebx) keys entries are wrapped differently: each entry is
  // itself typed as "keyd", THEN carries namespace(4)="mdta" + name — confirmed
  // by direct byte comparison against a real sample; the movie-level box above
  // does not use this wrapper.
  function makeTrackKeysBox(keyNames){
    var entries = keyNames.map(function(name){
      var nameBytes = new TextEncoder().encode(name);
      var e = new Uint8Array(12 + nameBytes.length);
      new DataView(e.buffer).setUint32(0, e.length, false);
      e[4]=0x6b; e[5]=0x65; e[6]=0x79; e[7]=0x64;   // "keyd"
      e[8]=0x6d; e[9]=0x64; e[10]=0x74; e[11]=0x61; // "mdta" namespace
      e.set(nameBytes, 12);
      return e;
    });
    var header = new Uint8Array(8);
    new DataView(header.buffer).setUint32(4, keyNames.length, false);
    return makeBox("keys", concatBytes([header].concat(entries)));
  }
  function makeIlstBox(values){
    var items = values.map(function(val, idx){
      var valBytes = new TextEncoder().encode(val);
      var dataPayload = new Uint8Array(8 + valBytes.length);
      new DataView(dataPayload.buffer).setUint32(0, 1, false); // well-known type: UTF-8 string
      dataPayload.set(valBytes, 8);
      var dataBox = makeBox("data", dataPayload);
      var n = idx + 1; // 1-based index into the keys table, used as the raw 4-byte "type"
      var itemType = String.fromCharCode((n>>>24)&0xFF, (n>>>16)&0xFF, (n>>>8)&0xFF, n&0xFF);
      return makeBox(itemType, dataBox);
    });
    return makeBox("ilst", concatBytes(items));
  }
  // The real sample places `meta` as a DIRECT child of moov — no udta wrapper.
  function buildContentIdentifierMeta(uuid){
    var metaPayload = concatBytes([
      makeHdlrBox(),
      makeKeysBox(["com.apple.quicktime.content.identifier"]),
      makeIlstBox([uuid])
    ]);
    return makeBox("meta", metaPayload);
  }

  function patchChunkOffsets(bytes, moovBox, delta){
    if(delta === 0) return;
    var targets = [];
    findBoxesRecursive(bytes, moovBox.dataStart, moovBox.end, ["stco","co64"], targets);
    var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    targets.forEach(function(b){
      var entryCount = view.getUint32(b.dataStart + 4, false);
      var entryStart = b.dataStart + 8;
      if(b.type === "stco"){
        for(var i=0;i<entryCount;i++){
          var off = entryStart + i*4;
          view.setUint32(off, view.getUint32(off, false) + delta, false);
        }
      } else {
        for(var j=0;j<entryCount;j++){
          var off8 = entryStart + j*8;
          view.setBigUint64(off8, view.getBigUint64(off8, false) + BigInt(delta), false);
        }
      }
    });
  }

  function injectContentIdentifierIntoMp4(mp4Bytes, uuid){
    var bytes = new Uint8Array(mp4Bytes); // mutable copy
    var topBoxes = parseBoxes(bytes, 0, bytes.length);
    var moovBox = topBoxes.filter(function(b){ return b.type === "moov"; })[0];
    var mdatBox = topBoxes.filter(function(b){ return b.type === "mdat"; })[0];
    if(!moovBox) throw new Error("No moov box found in generated video");

    var newMeta = buildContentIdentifierMeta(uuid);

    // Inserting bytes into moov shifts everything after it in the file. Sample
    // offset tables (stco/co64) store absolute file positions into mdat, so if
    // mdat comes after moov, those tables need to shift by the same amount.
    if(mdatBox && moovBox.start < mdatBox.start){
      patchChunkOffsets(bytes, moovBox, newMeta.length);
    }

    var newMoovPayload = concatBytes([bytes.slice(moovBox.dataStart, moovBox.end), newMeta]);
    var newMoovBox = makeBox("moov", newMoovPayload);

    return concatBytes(topBoxes.map(function(b){
      return b === moovBox ? newMoovBox : bytes.slice(b.start, b.end);
    }));
  }

  // ----- MOV/MP4: still-image-time timed metadata track -----
  function readU32(bytes, off){ return new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(off, false); }

  function findMvhdTimescale(bytes, moovBox){
    var mvhd = parseBoxes(bytes, moovBox.dataStart, moovBox.end).filter(function(b){ return b.type === "mvhd"; })[0];
    if(!mvhd) return 600;
    var version = bytes[mvhd.dataStart];
    return readU32(bytes, mvhd.dataStart + (version === 1 ? 20 : 12));
  }
  function findTrackIds(bytes, moovBox){
    var traks = parseBoxes(bytes, moovBox.dataStart, moovBox.end).filter(function(b){ return b.type === "trak"; });
    return traks.map(function(trak){
      var tkhd = parseBoxes(bytes, trak.dataStart, trak.end).filter(function(b){ return b.type === "tkhd"; })[0];
      var version = bytes[tkhd.dataStart];
      return readU32(bytes, tkhd.dataStart + (version === 1 ? 20 : 12));
    });
  }

  function makeMatrixIdentity(payload, offset){
    var dv = new DataView(payload.buffer);
    dv.setUint32(offset, 0x00010000, false);
    dv.setUint32(offset+16, 0x00010000, false);
    dv.setUint32(offset+32, 0x40000000, false);
  }
  function makeTkhd(trackId, movieDuration){
    var payload = new Uint8Array(84);
    var dv = new DataView(payload.buffer);
    dv.setUint32(0, 0x00000007, false); // enabled + in-movie + in-preview
    dv.setUint32(12, trackId, false);
    dv.setUint32(20, movieDuration, false);
    makeMatrixIdentity(payload, 40);
    return makeBox("tkhd", payload);
  }
  function makeMdhd(timescale, duration){
    var payload = new Uint8Array(24);
    var dv = new DataView(payload.buffer);
    dv.setUint32(12, timescale, false);
    dv.setUint32(16, duration, false);
    dv.setUint16(20, 0x55C4, false); // language = "und"
    return makeBox("mdhd", payload);
  }
  function makeMdiaHdlr(handlerType){
    var payload = new Uint8Array(25);
    for(var i=0;i<4;i++) payload[8+i] = handlerType.charCodeAt(i);
    return makeBox("hdlr", payload);
  }
  function makeDinf(){
    var urlBox = makeBox("url ", new Uint8Array([0,0,0,1])); // self-contained flag
    var drefPayload = concatBytes([new Uint8Array([0,0,0,0, 0,0,0,1]), urlBox]);
    return makeBox("dinf", makeBox("dref", drefPayload));
  }
  function makeStillImageTimeTrak(opts){
    // opts: {trackId, movieTimescale, mediaTimescale, sampleDuration}
    // returns {trak, stcoValueOffset} — stcoValueOffset is the byte offset, relative to
    // the start of `trak`, of the one chunk_offset value the caller must patch in later.
    var keys = makeTrackKeysBox(["com.apple.quicktime.still-image-time"]);
    var mebxPayload = new Uint8Array(8); // reserved(6) + data_reference_index(2)
    mebxPayload[7] = 1;
    var mebxEntry = makeBox("mebx", concatBytes([mebxPayload, keys]));
    var stsdHeader = new Uint8Array(8);
    new DataView(stsdHeader.buffer).setUint32(4, 1, false); // entry_count = 1
    var stsd = makeBox("stsd", concatBytes([stsdHeader, mebxEntry]));

    var stts = (function(){
      var p = new Uint8Array(16);
      var dv = new DataView(p.buffer);
      dv.setUint32(4, 1, false);                    // entry_count
      dv.setUint32(8, 1, false);                     // sample_count
      dv.setUint32(12, opts.sampleDuration, false);   // sample_delta
      return makeBox("stts", p);
    })();
    var stsc = (function(){
      var p = new Uint8Array(20);
      var dv = new DataView(p.buffer);
      dv.setUint32(4, 1, false);   // entry_count
      dv.setUint32(8, 1, false);   // first_chunk
      dv.setUint32(12, 1, false);  // samples_per_chunk
      dv.setUint32(16, 1, false);  // sample_description_index
      return makeBox("stsc", p);
    })();
    var stsz = (function(){
      var p = new Uint8Array(12);
      var dv = new DataView(p.buffer);
      dv.setUint32(4, 1, false); // sample_size (uniform, 1 byte per sample)
      dv.setUint32(8, 1, false); // sample_count
      return makeBox("stsz", p);
    })();
    var stco = (function(){
      var p = new Uint8Array(12);
      new DataView(p.buffer).setUint32(4, 1, false); // entry_count
      // chunk_offset (4 bytes, at payload offset 8) left as 0 — patched once the
      // final file layout is known, since it's an absolute file position
      return makeBox("stco", p);
    })();

    var boxesBeforeStco = [stsd, stts, stsc, stsz];
    var stbl = makeBox("stbl", concatBytes(boxesBeforeStco.concat([stco])));
    // real samples use gmhd+gmin (generic media header) for meta tracks, not nmhd;
    // gmin's payload is a fixed boilerplate template copied verbatim from a real file
    var gmin = makeBox("gmin", new Uint8Array([0,0,0,0, 0x00,0x40, 0x80,0x00, 0x80,0x00, 0x80,0x00, 0,0, 0,0]));
    var gmhd = makeBox("gmhd", gmin);
    var dinf = makeDinf();
    var minf = makeBox("minf", concatBytes([gmhd, dinf, stbl]));
    var mdhd = makeMdhd(opts.mediaTimescale, opts.sampleDuration);
    var hdlr = makeMdiaHdlr("meta");
    var mdia = makeBox("mdia", concatBytes([mdhd, hdlr, minf]));
    // no tref/cdsc — real samples don't link the meta track to the video track this way
    var movieDuration = Math.round(opts.movieTimescale * (opts.sampleDuration / opts.mediaTimescale));
    var tkhd = makeTkhd(opts.trackId, movieDuration);
    var trak = makeBox("trak", concatBytes([tkhd, mdia]));

    // stco's chunk_offset sits 8 bytes into stco's payload, i.e. 16 bytes into the
    // stco box (8-byte box header + 8-byte payload prefix). Locate stco's start by
    // summing everything before it, all the way up through trak's own header.
    var stblChildrenBeforeStco = boxesBeforeStco.reduce(function(s,b){ return s+b.length; }, 0);
    var stcoStartInTrak = 8 /*trak header*/ + tkhd.length +
      8 /*mdia header*/ + mdhd.length + hdlr.length +
      8 /*minf header*/ + gmhd.length + dinf.length +
      8 /*stbl header*/ + stblChildrenBeforeStco;

    return { trak: trak, stcoValueOffset: stcoStartInTrak + 16 };
  }

  function addStillImageTimeTrack(mp4Bytes){
    var bytes = new Uint8Array(mp4Bytes);
    var topBoxes = parseBoxes(bytes, 0, bytes.length);
    var moovBox = topBoxes.filter(function(b){ return b.type === "moov"; })[0];
    if(!moovBox) throw new Error("No moov box found in generated video");

    var movieTimescale = findMvhdTimescale(bytes, moovBox);
    var trackIds = findTrackIds(bytes, moovBox);
    var newTrackId = Math.max.apply(null, trackIds.concat([0])) + 1;
    var MEDIA_TIMESCALE = 600, SAMPLE_DURATION = 1; // ~1.7ms marker sample

    var built = makeStillImageTimeTrak({
      trackId: newTrackId,
      movieTimescale: movieTimescale,
      mediaTimescale: MEDIA_TIMESCALE,
      sampleDuration: SAMPLE_DURATION
    });

    var newMoovPayload = concatBytes([bytes.slice(moovBox.dataStart, moovBox.end), built.trak]);
    var newMoovBox = makeBox("moov", newMoovPayload);
    // the trak we appended sits right at the end of the new moov's payload
    var trakOffsetInNewMoov = newMoovBox.length - built.trak.length;

    var pieces = topBoxes.map(function(b){
      return b === moovBox ? newMoovBox : bytes.slice(b.start, b.end);
    });

    // our marker sample lives in a brand new mdat appended at the very end, so no
    // existing offsets anywhere else in the file need to change
    var markerMdat = makeBox("mdat", new Uint8Array([0xFF]));
    var priorLength = pieces.reduce(function(s,p){ return s + p.length; }, 0);
    var sampleAbsoluteOffset = priorLength + 8; // skip the new mdat's own 8-byte header

    new DataView(newMoovBox.buffer).setUint32(trakOffsetInNewMoov + built.stcoValueOffset, sampleAbsoluteOffset, false);

    return concatBytes(pieces.concat([markerMdat]));
  }

  function downloadLivePhoto(){
    if(!window.MediaRecorder){
      toast("MediaRecorder is not supported in this browser.");
      return;
    }
    var picked = pickMimeType("mp4");
    if(!picked || !picked.matchedPreference){
      toast("This browser can't record MP4, which Live Photo needs. Try Chrome or Safari.");
      return;
    }

    downloadBtn.classList.add("busy");
    downloadBtn.disabled = true;

    cancelAnimationFrame(rafId);

    var size = resolveExportSize();
    var xr = getExportRenderer();
    exportCanvas.width = size.w;
    exportCanvas.height = size.h;

    var uuid = uuidForLivePhoto();
    var FPS = 30, CLIP_DURATION = 1.8; // real Live Photos run short; keep comfortably under ~2s
    var totalFrames = Math.round(FPS * CLIP_DURATION);
    // lastLiveT is already speed-scaled shader time (radians), not seconds — the
    // still moment sits at the clip's midpoint, like a real Live Photo's key frame
    var clipStartT = lastLiveT - (CLIP_DURATION/2) * state.speed;

    function finish(){
      downloadBtn.classList.remove("busy");
      downloadBtn.disabled = false;
      rafId = requestAnimationFrame(liveLoop);
    }

    // capture the still frame first, at the exact midpoint moment ("now")
    xr.draw(lastLiveT, size.w, size.h, size.px);
    exportCanvas.toBlob(function(stillBlob){
      if(!stillBlob){
        toast("Couldn't capture the still frame in this browser.");
        finish();
        return;
      }
      stillBlob.arrayBuffer().then(function(stillBuf){
        var taggedJpegBytes = injectContentIdentifierIntoJpeg(new Uint8Array(stillBuf), uuid, size.w, size.h);

        var stream = exportCanvas.captureStream(0);
        var track = stream.getVideoTracks()[0];
        var canRequestFrame = typeof track.requestFrame === "function";
        if(!canRequestFrame) stream = exportCanvas.captureStream(FPS);

        var chunks = [];
        var recorder = new MediaRecorder(stream, { mimeType: picked.mimeType, videoBitsPerSecond: 8000000 });
        recorder.ondataavailable = function(e){ if(e.data && e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = function(){
          var videoBlob = new Blob(chunks, { type: picked.mimeType.split(";")[0] });
          videoBlob.arrayBuffer().then(function(videoBuf){
            var taggedMovBytes;
            try{
              taggedMovBytes = injectContentIdentifierIntoMp4(new Uint8Array(videoBuf), uuid);
              taggedMovBytes = addStillImageTimeTrack(taggedMovBytes);
            } catch(err){
              toast("Couldn't tag the video: " + err.message);
              finish();
              return;
            }

            var base = "dithering-live-" + uuid.slice(0,8).toLowerCase();
            var jpegFile = new File([taggedJpegBytes], base + ".jpg", { type: "image/jpeg" });
            var movFile = new File([taggedMovBytes], base + ".mov", { type: "video/quicktime" });

            function fallbackDownload(){
              [jpegFile, movFile].forEach(function(file, i){
                setTimeout(function(){
                  var url = URL.createObjectURL(file);
                  var a = document.createElement("a");
                  a.href = url; a.download = file.name;
                  document.body.appendChild(a); a.click(); document.body.removeChild(a);
                  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
                }, i * 250);
              });
              toast("Saved photo + video pair — see the note on importing as a Live Photo.");
              finish();
            }

            if(navigator.canShare && navigator.canShare({ files: [jpegFile, movFile] })){
              navigator.share({ files: [jpegFile, movFile] }).then(finish).catch(function(err){
                if(err && err.name === "AbortError"){ finish(); return; }
                fallbackDownload();
              });
            } else {
              fallbackDownload();
            }
          });
        };

        recorder.start();
        var frame = 0;
        function renderFrame(){
          if(frame >= totalFrames){ recorder.stop(); return; }
          xr.draw(clipStartT + (frame/FPS) * state.speed, size.w, size.h, size.px);
          if(canRequestFrame){
            track.requestFrame();
            frame++;
            setTimeout(renderFrame, 1000/FPS);
          } else {
            frame++;
            requestAnimationFrame(renderFrame);
          }
        }
        renderFrame();
      });
    }, "image/jpeg", 0.92);
  }

  downloadBtn.addEventListener("click", function(){
    if(downloadBtn.classList.contains("busy")) return;

    if(state.exportFormat === "livephoto"){
      downloadLivePhoto();
      return;
    }

    if(state.exportFormat === "jpeg"){
      downloadImageSnapshot();
      return;
    }

    if(!window.MediaRecorder){
      toast("MediaRecorder is not supported in this browser.");
      return;
    }
    var picked = pickMimeType(state.exportFormat);
    if(!picked){
      toast("No supported video codec found in this browser.");
      return;
    }
    var mimeType = picked.mimeType;
    if(state.exportFormat === "mp4" && !picked.matchedPreference){
      toast("This browser can't record MP4 — saving as WebM instead. Try Safari for MP4.");
    }

    downloadBtn.classList.add("busy");
    downloadBtn.disabled = true;

    // cancel live preview loop while we render the deterministic export
    cancelAnimationFrame(rafId);

    var size = resolveExportSize();
    var exportW = size.w, exportH = size.h, exportPx = size.px;

    var xr = getExportRenderer();
    var xcanvas = exportCanvas;
    xcanvas.width = exportW;
    xcanvas.height = exportH;

    var FPS = 30;
    var MIN_DURATION = 3, MAX_DURATION = 6.7; // small safety margin under the 7s ceiling for setTimeout drift
    // one full cycle at the configured speed, seamlessly looped; slower speeds
    // simply take longer (up to the cap) instead of being sped up to a fixed length
    var naturalPeriod = (2 * Math.PI) / state.speed;
    var cycles = Math.max(1, Math.ceil(MIN_DURATION / naturalPeriod));
    var idealDuration = cycles * naturalPeriod;
    var TARGET_DURATION, angularSpeed;
    if(idealDuration <= MAX_DURATION){
      TARGET_DURATION = idealDuration;
      angularSpeed = state.speed; // exact configured speed, perfect loop
    } else {
      TARGET_DURATION = MAX_DURATION;
      angularSpeed = (cycles * 2 * Math.PI) / TARGET_DURATION; // closest rate achievable within the cap
    }
    var totalFrames = Math.round(FPS * TARGET_DURATION);

    var stream = xcanvas.captureStream(0); // manual frame control
    var track = stream.getVideoTracks()[0];
    var canRequestFrame = typeof track.requestFrame === "function";
    if(!canRequestFrame){
      // fallback: automatic capture at fixed fps
      stream = xcanvas.captureStream(FPS);
    }

    var chunks = [];
    var recorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 8000000 });
    recorder.ondataavailable = function(e){ if(e.data && e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = function(){
      var blob = new Blob(chunks, { type: mimeType.split(";")[0] });
      var ext = mimeType.indexOf("mp4") !== -1 ? "mp4" : "webm";
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "dithering-wave-loop-" + exportW + "x" + exportH + "." + ext;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);

      downloadBtn.classList.remove("busy");
      downloadBtn.disabled = false;
      toast("Saved " + TARGET_DURATION.toFixed(1) + "s loop, " + exportW + "×" + exportH + " (" + ext.toUpperCase() + ")");

      rafId = requestAnimationFrame(liveLoop);
    };

    recorder.start();

    var frame = 0;
    function renderExportFrame(){
      if(frame >= totalFrames){
        recorder.stop();
        return;
      }
      var t = (frame / FPS) * angularSpeed;
      xr.draw(t, exportW, exportH, exportPx);
      if(canRequestFrame){
        track.requestFrame();
        frame++;
        setTimeout(renderExportFrame, 1000 / FPS);
      } else {
        frame++;
        requestAnimationFrame(renderExportFrame);
      }
    }
    renderExportFrame();
  });

})();
</script>
</body>
